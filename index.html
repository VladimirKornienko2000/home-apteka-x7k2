<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аптечка дома</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #f2f6f4;
  --surface: #ffffff;
  --surface-2: #e8efec;
  --text: #13211c;
  --dim: #566761;
  --line: #d8e2de;
  --accent: #1c7558;
  --accent-ink: #ffffff;
  --accent-soft: #dcefe7;
  --ok: #2c7a4b;
  --warn: #8f5a08;
  --warn-soft: #faedd3;
  --bad: #ae3326;
  --bad-soft: #f9dfdb;
  --z1: #c8482f;
  --z2: #2b6cb0;
  --z3: #96640c;
  --z4: #7250b0;
  --on-z: #ffffff;
  --shadow: 0 1px 2px rgba(19, 33, 28, 0.06);
  --font: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1a16;
    --surface: #17241f;
    --surface-2: #1f2f29;
    --text: #e6f0ec;
    --dim: #93a8a0;
    --line: #2b3d36;
    --accent: #4cc39a;
    --accent-ink: #08221a;
    --accent-soft: #1d3b31;
    --ok: #62c98d;
    --warn: #e8b25a;
    --warn-soft: #3a2c12;
    --bad: #f0806f;
    --bad-soft: #40201b;
    --z1: #ee7d66;
    --z2: #6aa5e6;
    --z3: #dfa943;
    --z4: #a98be0;
    --on-z: #0f1a16;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1a16;
  --surface: #17241f;
  --surface-2: #1f2f29;
  --text: #e6f0ec;
  --dim: #93a8a0;
  --line: #2b3d36;
  --accent: #4cc39a;
  --accent-ink: #08221a;
  --accent-soft: #1d3b31;
  --ok: #62c98d;
  --warn: #e8b25a;
  --warn-soft: #3a2c12;
  --bad: #f0806f;
  --bad-soft: #40201b;
  --z1: #ee7d66;
  --z2: #6aa5e6;
  --z3: #dfa943;
  --z4: #a98be0;
  --on-z: #0f1a16;
  --shadow: none;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.45;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.head {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--line);
  padding: 12px 16px 12px;
}
.head-in { max-width: 1040px; margin: 0 auto; display: grid; gap: 10px; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.count { color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
.btn {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 8px 14px;
  font-weight: 500;
  min-height: 40px;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.search-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.search {
  position: relative;
}
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--dim); }
.search input {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px 10px 38px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--surface);
  font-size: 16px;
}
.seg { display: inline-grid; grid-auto-flow: column; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 0 12px; min-height: 36px; color: var(--dim); font-weight: 500; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }

main { max-width: 1040px; margin: 0 auto; padding: 14px 16px 60px; display: grid; gap: 14px; }
.notice {
  font-size: 13px;
  color: var(--dim);
  background: var(--surface-2);
  border-radius: 8px;
  padding: 8px 12px;
}
.filters { display: grid; gap: 10px; }
.frow { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.frow::-webkit-scrollbar { display: none; }
.chip {
  flex: none;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 0 13px;
  min-height: 36px;
  font-size: 14px;
  white-space: nowrap;
  color: var(--dim);
  display: inline-flex;
  align-items: center;
  gap: 7px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip .n { font-family: var(--mono); font-size: 12px; opacity: 0.85; }
.chip.zc .zdot { width: 9px; height: 9px; border-radius: 2px; background: var(--zc); }
.chip.zc[aria-pressed="true"] .zdot { background: var(--accent-ink); }
.chip.flag[data-kind="bad"]:not([aria-pressed="true"]) { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.chip.flag[data-kind="warn"]:not([aria-pressed="true"]) { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 40%, var(--line)); }
.tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.tools label { color: var(--dim); font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
.tools select {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; min-height: 36px;
}

.analogs {
  border: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
  background: var(--accent-soft);
  border-radius: 12px;
  padding: 12px 14px;
  display: grid;
  gap: 10px;
}
.analogs h2 { margin: 0; font-size: 14px; font-weight: 600; }
.agroup { display: grid; gap: 6px; }
.agroup .k { font-size: 13px; font-weight: 600; }
.achips { display: flex; flex-wrap: wrap; gap: 6px; }
.ach {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 8px;
  padding: 5px 9px;
  font-size: 13px;
  text-align: left;
  display: inline-flex;
  gap: 6px;
  align-items: baseline;
  flex-wrap: wrap;
}
.ach b { font-weight: 600; }
.ach span { color: var(--dim); font-variant-numeric: tabular-nums; }

.grid { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 860px) { .grid { grid-template-columns: 1fr 1fr; } }

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 14px;
  display: grid;
  gap: 10px;
  box-shadow: var(--shadow);
  align-content: start;
}
.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.name { font-size: 16px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
.qtext { font-size: 12px; color: var(--dim); margin-top: 2px; overflow-wrap: anywhere; }

.stock { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.sb {
  width: 38px; height: 38px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 8px;
  font-size: 20px; line-height: 1;
  display: grid; place-items: center;
}
.sb:disabled { opacity: 0.35; cursor: default; }
.sv {
  min-width: 64px; min-height: 38px;
  border: 0; background: transparent;
  font-family: var(--mono); font-weight: 600; font-size: 17px;
  display: inline-flex; align-items: baseline; justify-content: center; gap: 4px;
  padding: 0 4px;
  font-variant-numeric: tabular-nums;
}
.sv .unit, .stock .unit { font-family: var(--font); font-weight: 500; font-size: 12px; color: var(--dim); }
.sin {
  width: 84px; min-height: 38px; text-align: center;
  border: 2px solid var(--accent); border-radius: 8px; background: var(--surface);
  font-family: var(--mono); font-size: 17px; font-weight: 600;
}

.loc {
  --zc: var(--dim);
  display: flex; align-items: center; gap: 10px;
  border-radius: 10px;
  padding: 7px 10px 7px 7px;
  background: color-mix(in srgb, var(--zc) 12%, var(--surface));
  border: 1px solid color-mix(in srgb, var(--zc) 30%, var(--line));
}
.loc.z1 { --zc: var(--z1); } .loc.z2 { --zc: var(--z2); } .loc.z3 { --zc: var(--z3); } .loc.z4 { --zc: var(--z4); }
.loc .zn {
  width: 30px; height: 30px; border-radius: 7px;
  background: var(--zc); color: var(--on-z);
  font-family: var(--mono); font-weight: 600; font-size: 16px;
  display: grid; place-items: center; flex: none;
}
.loc.z0 .zn { background: var(--surface-2); color: var(--dim); }
.loc .lt { display: grid; line-height: 1.25; min-width: 0; }
.loc .lt b { font-size: 14px; font-weight: 600; }
.loc .lt small { color: var(--dim); font-size: 12.5px; }

.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); color: var(--dim); overflow-wrap: anywhere; }
.tag.sub { background: var(--accent-soft); color: var(--accent); font-weight: 500; }
.tag.exp.ok { background: var(--surface-2); color: var(--dim); }
.tag.exp.soon, .tag.unclear { background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.tag.exp.expired, .tag.empty { background: var(--bad-soft); color: var(--bad); font-weight: 500; }
.notes {
  margin: 0; font-size: 13px; color: var(--dim);
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  cursor: pointer;
}
.notes.open { -webkit-line-clamp: unset; display: block; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.link {
  border: 0; background: transparent; color: var(--accent); font-weight: 500; font-size: 14px;
  min-height: 36px; padding: 0 10px 0 0;
}
.link.del { color: var(--bad); }
.link.plain { color: var(--dim); }

.sgroup { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 8px; align-content: start; }
.sgroup h3 { margin: 0; font-size: 16px; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
.sgroup h3 span { font-size: 12.5px; color: var(--dim); font-weight: 500; }
.srow { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding-top: 8px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.srow .sn { font-weight: 500; overflow-wrap: anywhere; }
.srow .sm { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--dim); font-variant-numeric: tabular-nums; }
.zmini { font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 2px 7px; border-radius: 6px; background: var(--zc, var(--surface-2)); color: var(--on-z); }
.zmini.z1 { --zc: var(--z1); } .zmini.z2 { --zc: var(--z2); } .zmini.z3 { --zc: var(--z3); } .zmini.z4 { --zc: var(--z4); }

.empty { text-align: center; color: var(--dim); padding: 40px 16px; border: 1px dashed var(--line); border-radius: 12px; }
.foot { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; color: var(--dim); font-size: 13px; padding-top: 6px; }

.overlay[hidden] { display: none; }
.overlay { position: fixed; inset: 0; background: rgba(6, 14, 11, 0.55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--bg);
  width: 100%; max-width: 620px;
  border-radius: 16px 16px 0 0;
  padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  max-height: 92%; overflow-y: auto;
  display: grid; gap: 12px;
}
@media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 16px; } }
.sheet h2 { margin: 0; font-size: 18px; }
.f { display: grid; gap: 5px; }
.f label { font-size: 13px; color: var(--dim); }
.f input[type="text"], .f input[type="number"], .f select, .f textarea {
  width: 100%; min-height: 42px; padding: 8px 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-size: 16px;
}
.f textarea { min-height: 64px; resize: vertical; }
.r2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.r3 { display: grid; grid-template-columns: 1.2fr 1fr; gap: 10px; }
.chk { display: flex; align-items: center; gap: 8px; font-size: 14px; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.err { color: var(--bad); font-size: 13px; min-height: 18px; }
.sheet-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }
</style>
</head><body>

<header class="head">
  <div class="head-in">
    <div class="title-row">
      <div>
        <h1>Аптечка дома</h1>
        <div class="count" id="count"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn" id="syncBtn" type="button" title="Синхронизация между устройствами">☁ …</button>
        <button class="btn primary" id="addBtn" type="button">Добавить</button>
      </div>
    </div>
    <div id="syncPanel" hidden style="margin:8px 0;padding:10px;border:1px solid var(--line,#8884);border-radius:10px;font-size:13px">
      <div id="syncMsg" style="margin-bottom:8px"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <input id="syncTok" type="password" placeholder="GitHub-токен (один раз на устройстве)" autocomplete="off" style="flex:1;min-width:200px;padding:8px;border-radius:8px;border:1px solid #8886;background:transparent;color:inherit">
        <button class="btn" id="syncSaveTok" type="button">Сохранить токен</button>
        <button class="btn" id="syncNow" type="button">Синхронизировать</button>
      </div>
    </div>
    <div class="search-row">
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Название или действующее вещество" autocomplete="off" aria-label="Поиск">
      </div>
      <div class="seg" role="group" aria-label="Вид">
        <button type="button" data-act="view" data-v="list" aria-pressed="true">Препараты</button>
        <button type="button" data-act="view" data-v="subs" aria-pressed="false">Вещества</button>
      </div>
    </div>
  </div>
</header>

<main>
  <div class="notice">Предпросмотр. Данные из общей базы на 25.09.2026. Правки в этой версии сохраняются только в этом браузере.</div>
  <section class="filters" id="filters"></section>
  <div id="content"></div>
  <div class="foot" id="foot"></div>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Добавить лекарство</h2>
    <div class="f"><label for="f_name">Название</label><input id="f_name" type="text" autocomplete="off"></div>
    <div class="f"><label for="f_sub">Действующее вещество (несколько через +)</label><input id="f_sub" type="text" autocomplete="off"></div>
    <div class="r2">
      <div class="f"><label for="f_cat">Категория</label><select id="f_cat"></select></div>
      <div class="f"><label for="f_zone">Где хранится</label><select id="f_zone"></select></div>
    </div>
    <div class="r3">
      <div class="f"><label for="f_stock">Остаток (число)</label><input id="f_stock" type="number" inputmode="decimal" step="any" min="0"></div>
      <div class="f"><label for="f_unit">Единица</label><select id="f_unit"></select></div>
    </div>
    <label class="chk"><input type="checkbox" id="f_approx"> Остаток приблизительный</label>
    <div class="r2">
      <div class="f"><label for="f_form">Форма</label><select id="f_form"></select></div>
      <div class="f"><label for="f_exp">Срок годности</label><input id="f_exp" type="text" placeholder="до 09.2027" autocomplete="off"></div>
    </div>
    <div class="f"><label for="f_qty">Количество, как записано</label><input id="f_qty" type="text" autocomplete="off"></div>
    <div class="f"><label for="f_notes">Заметки</label><textarea id="f_notes"></textarea></div>
    <label class="chk"><input type="checkbox" id="f_unclear"> Название или данные под вопросом</label>
    <div class="err" id="f_err" role="alert"></div>
    <div class="sheet-acts">
      <button class="btn" id="cancelBtn" type="button">Отмена</button>
      <button class="btn primary" id="saveBtn" type="button">Сохранить</button>
    </div>
  </div>
</div>

    if (it.unclear) tags += '<span class="tag unclear">Уточнить</span>';
    if (it.stock === 0) tags += '<span class="tag empty">Закончилось</span>';
    var acts = st.delConfirm === it.id
      ? '<button class="link del" type="button" data-act="delyes" data-id="' + id + '">Удалить насовсем</button><button class="link plain" type="button" data-act="delno">Отмена</button>'
      : '<button class="link" type="button" data-act="edit" data-id="' + id + '">Изменить</button><button class="link del" type="button" data-act="del" data-id="' + id + '">Удалить</button>';
    return '<article class="card"><div class="card-top"><div><div class="name">' + esc(it.name) + '</div>' +
      (it.form ? '<div class="qtext">' + esc(cap(it.form)) + '</div>' : '') + '</div>' + stockHtml(it) + '</div>' +
      locHtml(it) +
      (tags ? '<div class="tags">' + tags + '</div>' : '') +
      (it.notes ? '<p class="notes" data-act="note">' + esc(it.notes) + '</p>' : '') +
      '<div class="acts">' + acts + '</div></article>';
  }

  function analogHtml() {
    var q = st.q.trim().toLowerCase();
    if (!q) return '';
    var keys = [];
    function add(c) { if (keys.indexOf(c) < 0) keys.push(c); }
    var direct = items.filter(matchesQ);
    direct.forEach(function (it) { comps(it).forEach(add); });
    items.forEach(function (it) { comps(it).forEach(function (c) { if (c.indexOf(q) >= 0) add(c); }); });
    var gs = [];
    keys.forEach(function (c) {
      var arr = items.filter(function (it) { return comps(it).indexOf(c) >= 0; });
      if (arr.length >= 2) gs.push([c, arr]);
    });
    if (!gs.length) return '';
    var h = '<section class="analogs"><h2>Дома с тем же действующим веществом</h2>';
    gs.forEach(function (g) {
      h += '<div class="agroup"><div class="k">' + esc(cap(g[0])) + ' · ' + g[1].length + '</div><div class="achips">';
      g[1].forEach(function (it) {
        var z = zoneOf(it);
        h += '<button type="button" class="ach" data-act="pick" data-name="' + esc(it.name) + '"><b>' + esc(it.name) + '</b><span>' + esc(stockText(it)) + (z ? ' · зона ' + z : '') + '</span></button>';
      });
      h += '</div></div>';
    });
    return h + '</section>';
  }

  function subsHtml() {
    var map = {}, order = [];
    items.forEach(function (it) {
      comps(it).forEach(function (c) { if (!map[c]) { map[c] = []; order.push(c); } map[c].push(it); });
    });
    var q = st.q.trim().toLowerCase();
    var gs = order.filter(function (c) { return map[c].length >= 2; }).filter(function (c) {
      return !q || c.indexOf(q) >= 0 || map[c].some(function (it) { return (it.name || '').toLowerCase().indexOf(q) >= 0; });
    }).sort(function (a, b) { return map[b].length - map[a].length || a.localeCompare(b, 'ru'); });
    if (!gs.length) return '<div class="empty">Повторяющихся действующих веществ не найдено</div>';
    var h = '<div class="grid">';
    gs.forEach(function (c) {
      h += '<section class="sgroup"><h3>' + esc(cap(c)) + '<span>' + map[c].length + ' препарата дома</span></h3>';
      map[c].slice().sort(function (a, b) { return (a.name || '').localeCompare(b.name || '', 'ru'); }).forEach(function (it) {
        h += '<div class="srow"><span class="sn">' + esc(it.name) + '</span><span class="sm">' + esc(stockText(it)) + zoneChipMini(it) + '</span></div>';
      });
      h += '</section>';
    });
    return h + '</div>';
  }

  function renderContent() {
    var el = document.getElementById('content'), h;
    if (st.view === 'subs') {
      h = '<p class="notice" style="margin:0 0 12px">Вещества, которые встречаются в двух и более препаратах. Проверяйте этот список, чтобы не купить дубль.</p>' + subsHtml();
    } else {
      var list = filtered();
      h = analogHtml();
      h += list.length ? '<div class="grid"' + (h ? ' style="margin-top:14px"' : '') + '>' + list.map(cardHtml).join('') + '</div>' : '<div class="empty">Ничего не найдено. Измените запрос или фильтры.</div>';
      document.getElementById('count').textContent = 'Показано ' + list.length + ' из ' + items.length;
    }
    if (st.view === 'subs') document.getElementById('count').textContent = items.length + ' позиций';
    el.innerHTML = h;
    if (st.editingStock) { var si = document.getElementById('si'); if (si) { si.focus(); si.select(); } }
    var foot = document.getElementById('foot');
    foot.innerHTML = '<span>Срок считается до конца указанного месяца.</span>' +
      (st.resetConfirm
        ? '<span><button class="btn danger" type="button" data-act="resetyes">Сбросить все правки</button> <button class="btn" type="button" data-act="resetno">Отмена</button></span>'
        : '<button class="btn" type="button" data-act="reset">Вернуть данные на 25.09.2026</button>');
  }
  function renderAll() { renderFilters(); renderContent(); }

  /* ---------- sheet ---------- */
  var ov = document.getElementById('overlay');
  function fillSelects() {
    document.getElementById('f_cat').innerHTML = CATEGORIES.map(function (c) { return '<option>' + esc(c) + '</option>'; }).join('');
    document.getElementById('f_zone').innerHTML = '<option value="0">Не указано</option>' + [1, 2, 3, 4].map(function (z) { return '<option value="' + z + '">Зона ' + z + ' · ' + esc(ZONES[z].n) + '</option>'; }).join('');
    document.getElementById('f_unit').innerHTML = UNITS.map(function (u) { return '<option>' + u + '</option>'; }).join('');
    document.getElementById('f_form').innerHTML = '<option value="">Не указана</option>' + FORMS.map(function (f) { return '<option>' + esc(f) + '</option>'; }).join('');
  }
  function openSheet(id) {
    st.editId = id || null;
    var it = id ? byId(id) : { name: '', substance: '', category: CATEGORIES[0], location: '', stock: null, unit: 'шт', stockApprox: false, quantity: '', form: '', expiry: '', notes: '', unclear: false };
    document.getElementById('sheetTitle').textContent = id ? 'Изменить лекарство' : 'Добавить лекарство';
    document.getElementById('f_name').value = it.name || '';
    document.getElementById('f_sub').value = it.substance || '';
    document.getElementById('f_cat').value = it.category || CATEGORIES[0];
    document.getElementById('f_zone').value = String(zoneOf(it));
    document.getElementById('f_stock').value = it.stock == null ? '' : it.stock;
    document.getElementById('f_unit').value = it.unit || 'шт';
    document.getElementById('f_approx').checked = !!it.stockApprox;
    document.getElementById('f_qty').value = it.quantity || '';
    document.getElementById('f_form').value = it.form || '';
    document.getElementById('f_exp').value = it.expiry || '';
    document.getElementById('f_notes').value = it.notes || '';
    document.getElementById('f_unclear').checked = !!it.unclear;
    document.getElementById('f_err').textContent = '';
    ov.hidden = false;
    document.getElementById('f_name').focus();
  }
  function closeSheet() { ov.hidden = true; st.editId = null; }
  function saveSheet() {
    var name = document.getElementById('f_name').value.trim();
    if (!name) { document.getElementById('f_err').textContent = 'Введите название препарата.'; return; }
    var sv = document.getElementById('f_stock').value.trim();
    var zone = +document.getElementById('f_zone').value;
    var old = st.editId ? byId(st.editId) : null;
    var loc = old && zoneOf(old) === zone ? old.location : (zone ? ZONES[zone].loc : '');
    var data = {
      name: name,
      substance: document.getElementById('f_sub').value.trim(),
      category: document.getElementById('f_cat').value,
      location: loc,
      unit: document.getElementById('f_unit').value,
      quantity: document.getElementById('f_qty').value.trim(),
      form: document.getElementById('f_form').value,
      expiry: document.getElementById('f_exp').value.trim(),
      notes: document.getElementById('f_notes').value.trim(),
      unclear: document.getElementById('f_unclear').checked,
      stockApprox: document.getElementById('f_approx').checked
    };
    if (sv !== '' && !isNaN(+sv)) data.stock = +sv; else delete data.stock;
    if (old) { Object.keys(data).forEach(function (k) { old[k] = data[k]; }); if (!('stock' in data)) delete old.stock; }
    else { data.id = 'u' + Date.now().toString(36); items.push(data); }
    save(); closeSheet(); renderAll();
  }

  /* ---------- events ---------- */
  document.getElementById('q').addEventListener('input', function (e) { st.q = e.target.value; renderContent(); });
  document.getElementById('addBtn').addEventListener('click', function () { openSheet(null); });
  document.getElementById('cancelBtn').addEventListener('click', closeSheet);
  document.getElementById('saveBtn').addEventListener('click', saveSheet);
  ov.addEventListener('click', function (e) { if (e.target === ov) closeSheet(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !ov.hidden) closeSheet();
    if (e.target && e.target.id === 'si') {
      if (e.key === 'Enter') e.target.blur();
      else if (e.key === 'Escape') { st.editingStock = null; renderContent(); }
    }
  });
  document.addEventListener('change', function (e) {
    if (e.target && e.target.id === 'sortSel') { st.sort = e.target.value; renderContent(); }
  });
  document.addEventListener('focusout', function (e) {
    if (e.target && e.target.id === 'si' && st.editingStock) {
      var it = byId(st.editingStock), v = e.target.value.trim();
      st.editingStock = null;
      if (it && v !== '' && !isNaN(+v)) { it.stock = Math.max(0, +v); it.stockApprox = false; save(); }
      renderAll();
    }
  });
  document.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!t) return;
    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id'), it = id ? byId(id) : null;
    if (act === 'view') { st.view = t.getAttribute('data-v'); renderAll(); }
    else if (act === 'zone') { st.zone = +t.getAttribute('data-z'); renderAll(); }
    else if (act === 'cat') { st.cat = t.getAttribute('data-c'); renderAll(); }
    else if (act === 'flag') { var f = t.getAttribute('data-f'); st.flags[f] = !st.flags[f]; renderAll(); }
    else if (act === 'inc' && it) { it.stock = Math.round(((it.stock || 0) + stepOf(it.unit)) * 100) / 100; save(); renderAll(); }
    else if (act === 'dec' && it) { it.stock = Math.max(0, Math.round(((it.stock || 0) - stepOf(it.unit)) * 100) / 100); save(); renderAll(); }
    else if (act === 'editstock' && it) { st.editingStock = it.id; renderContent(); }
    else if (act === 'edit' && it) { openSheet(it.id); }
    else if (act === 'del' && it) { st.delConfirm = it.id; renderContent(); }
    else if (act === 'delno') { st.delConfirm = null; renderContent(); }
    else if (act === 'delyes' && it) { items = items.filter(function (x) { return x.id !== it.id; }); st.delConfirm = null; save(); renderAll(); }
    else if (act === 'note') { t.classList.toggle('open'); }
    else if (act === 'pick') { st.q = t.getAttribute('data-name'); document.getElementById('q').value = st.q; renderContent(); window.scrollTo(0, 0); }
    else if (act === 'reset') { st.resetConfirm = true; renderContent(); }
    else if (act === 'resetno') { st.resetConfirm = false; renderContent(); }
    else if (act === 'resetyes') { items = clone(SEED); st.resetConfirm = false; save(); renderAll(); }
  });


  // ---- Синхронизация с GitHub (data.json в репозитории) ----
  var GH_REPO = 'VladimirKornienko2000/home-apteka-x7k2', GH_FILE = 'data.json', TOK_KEY = 'apteka-gh-token', DIRTY_KEY = 'apteka-dirty';
  var syncTimer = null, syncBusy = false;
  function lsGet(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
  function lsSet(k, v) { try { if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function setSync(label, msg) {
    document.getElementById('syncBtn').textContent = label;
    if (msg != null) document.getElementById('syncMsg').textContent = msg;
  }
  function ghUrl() { return 'https://api.github.com/repos/' + GH_REPO + '/contents/' + GH_FILE; }
  function ghHeaders(raw) {
    var h = { 'Accept': raw ? 'application/vnd.github.raw+json' : 'application/vnd.github+json' };
    var t = lsGet(TOK_KEY); if (t) h['Authorization'] = 'Bearer ' + t;
    return h;
  }
  function b64(s) { return btoa(unescape(encodeURIComponent(s))); }
  function pullRemote() {
    return fetch(ghUrl() + '?t=' + Date.now(), { headers: ghHeaders(true), cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (a) {
      if (!Array.isArray(a) || !a.length) throw new Error('пустые данные');
      items = a; try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch (e) {}
      lsSet(DIRTY_KEY, null); renderAll();
    });
  }
  function pushRemote() {
    if (!lsGet(TOK_KEY)) { setSync('☁ без токена', 'Правки сохранены только на этом устройстве. Введите токен, чтобы они попадали на все устройства.'); return Promise.resolve(); }
    if (syncBusy) { scheduleSync(); return Promise.resolve(); }
    syncBusy = true; setSync('☁ сохраняю…');
    return fetch(ghUrl() + '?t=' + Date.now(), { headers: ghHeaders(false), cache: 'no-store' }).then(function (r) {
      if (r.status === 404) return null;
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (meta) {
      var body = { message: 'Обновление базы ' + new Date().toISOString(), content: b64(JSON.stringify(items, null, 1)) };
      if (meta && meta.sha) body.sha = meta.sha;
      return fetch(ghUrl(), { method: 'PUT', headers: ghHeaders(false), body: JSON.stringify(body) });
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      lsSet(DIRTY_KEY, null); setSync('☁ синхронизировано', 'Сохранено в GitHub: ' + new Date().toLocaleString('ru-RU'));
    }).catch(function (e) {
      setSync('☁ ошибка', 'Не удалось сохранить (' + e.message + '). Правки остались на устройстве, повторю при следующем изменении.');
    }).then(function () { syncBusy = false; });
  }
  function scheduleSync() { lsSet(DIRTY_KEY, '1'); clearTimeout(syncTimer); syncTimer = setTimeout(pushRemote, 1500); }
  function initSync() {
    var btn = document.getElementById('syncBtn'), panel = document.getElementById('syncPanel');
    btn.addEventListener('click', function () { panel.hidden = !panel.hidden; });
    document.getElementById('syncSaveTok').addEventListener('click', function () {
      var v = document.getElementById('syncTok').value.trim();
      if (v) { lsSet(TOK_KEY, v); document.getElementById('syncTok').value = ''; setSync('☁ токен сохранён', 'Токен сохранён на этом устройстве.'); pushRemote(); }
    });
    document.getElementById('syncNow').addEventListener('click', function () {
      (lsGet(DIRTY_KEY) ? pushRemote() : pullRemote().then(function () { setSync('☁ синхронизировано', 'Данные загружены: ' + new Date().toLocaleString('ru-RU')); })).catch(function (e) { setSync('☁ ошибка', 'Ошибка: ' + e.message); });
    });
    if (lsGet(DIRTY_KEY) && lsGet(TOK_KEY)) { pushRemote(); }
    else { pullRemote().then(function () { setSync('☁ синхронизировано', 'Данные загружены из GitHub.'); }).catch(function () { setSync(lsGet(TOK_KEY) ? '☁ офлайн' : '☁ без токена', 'Не удалось загрузить данные из GitHub, показаны сохранённые на устройстве.'); }); }
  }
  fillSelects();
  renderAll();
  window.__syncReady = true; initSync();
})();
</script>
